services:
  - type: web
    name: story-rewrite-backend
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://spongebobtdgameplay-prog.github.io,https://story-rewrite-backend.onrender.com
      - key: DATABASE_URL
        sync: false
