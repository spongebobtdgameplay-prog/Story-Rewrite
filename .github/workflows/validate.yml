name: Validate Story Rewrite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - run: node --check server.js
      - run: node --check network.js
      - run: node --check app.js
      - run: node --check audio.js
      - run: node --check auth.js
      - run: node --check main.js
      - run: node --check levels.js
      - run: node --check multiplayer.js
      - run: node --check dialog.js
