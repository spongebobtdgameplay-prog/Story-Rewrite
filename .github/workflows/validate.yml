name: Validate Story Rewrite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - run: node --check server-v8.js
      - run: node --check server-v9.js
      - run: node --check server-v10.js
      - run: node --check server-v11.js
      - run: node --check server-config.js
      - run: node --check network.js
      - run: node --check app.js
      - run: node --check audio.js
      - run: node --check real-audio.js
      - run: node --check shell.js
      - run: node --check service-worker.js
      - run: node --check auth.js
      - run: node --check main.js
      - run: node --check levels.js
      - run: node --check multiplayer.js
      - run: node --check multiplayer-connection.js
      - run: node --check moderation-version.js
      - run: node --check host-controls.js
      - run: node --check ai-chat.js
      - name: Validate StoryBot browser composer
        run: |
          node <<'NODE'
          const fs = require("fs");
          const AI = fs.readFileSync("ai-chat.js", "utf8");
          const Lobby = fs.readFileSync("multiplayer.html", "utf8");
          const Game = fs.readFileSync("dialog.html", "utf8");
          const CSS = fs.readFileSync("chat-ai.css", "utf8");

          const Must = [
              [AI, "function PrepareStoryBotComposer", "composer preparation helper"],
              [AI, "function UpdateStoryBotComposerLength", "composer length helper"],
              [AI, "function GetActiveMentionText", "mention lookup helper"],
              [AI, "async function SubmitStoryBotFromChat", "normal chat submit path"],
              [AI, "storybot:ask", "direct StoryBot socket event"],
              [Lobby, 'id="ChatInput"', "lobby chat composer"],
              [Lobby, "@StoryBot", "lobby StoryBot instruction"],
              [Game, 'id="GameChatInput"', "game chat composer"],
              [Game, "@StoryBot", "game StoryBot instruction"],
              [CSS, ".StoryBotTyping", "StoryBot typing indicator"],
              [CSS, ".StoryBotCommandPopup", "StoryBot command popup"]
          ];
          for (const [Text, Needle, Label] of Must) {
              if (!Text.includes(Needle)) throw new Error("Missing " + Label + ".");
          }

          for (const [Text, Needle, Label] of [
              [AI, "StoryBotDialog", "separate StoryBot dialog code"],
              [AI, "StoryBotPromptHost", "separate StoryBot prompt host"],
              [AI, "storybot:prompt", "separate StoryBot prompt socket"]
          ]) {
              if (Text.includes(Needle)) throw new Error("Obsolete " + Label + " remains.");
          }

          for (const [Text, Pattern, Label] of [
              [AI, "/@story\\s*bot\\b/i", "StoryBot mention detection"],
              [AI, /Event\.stopImmediatePropagation\(\)/, "normal composer submit interception"]
          ]) {
              if (!Pattern.test(Text)) throw new Error("Missing " + Label + ".");
          }

          console.log("StoryBot browser composer contract OK.");
          NODE

      - name: Validate StoryBot Python runtime
        run: |
          python -m py_compile storybot_ai.py
          python <<'PY'
          import os
          import sys
          import types

          os.environ["STORYBOT_WEB_KNOWLEDGE"] = "0"
          os.environ["STORYBOT_MAX_TOKENS"] = "32"

          fake_llama = types.ModuleType("llama_cpp")
          class FakeLlama:
              def create_chat_completion(self, **kwargs):
                  assert kwargs["max_tokens"] == 32
                  return {"choices": [{"message": {"content": "Mock StoryBot response."}}]}
          fake_llama.Llama = FakeLlama
          sys.modules["llama_cpp"] = fake_llama

          import storybot_ai

          calls = {"count": 0}
          class SmokeModel:
              def create_chat_completion(self, **kwargs):
                  calls["count"] += 1
                  assert kwargs["messages"][0]["role"] == "system"
                  assert kwargs["messages"][1]["role"] == "user"
                  return {"choices": [{"message": {"content": "Mock StoryBot response."}}]}

          reply = storybot_ai.GenerateReply(SmokeModel(), {
              "askingPlayer": "Tester",
              "question": "What is happening in the current stage?",
              "room": {"status": "playing", "players": []},
              "stage": {"name": "Smoke Test", "objective": "Survive"},
              "recentChat": []
          })

          assert reply == "Mock StoryBot response."
          assert calls["count"] == 1
          print("StoryBot Python runtime smoke test OK.")
          PY
      - name: Validate generated StoryBot server
        run: |
          node <<'NODE'
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const Module = require("module");
          const { spawnSync } = require("child_process");
          const Root = process.cwd();
          function CompileWrapper(Source, Filename) {
              const Marker = /\nconst RuntimeModule = new Module\([^\n]+\);[\s\S]*?RuntimeModule\._compile\([^\n]+\);\s*$/;
              if (!Marker.test(Source)) throw new Error("Missing wrapper compile marker: " + Filename);
              const Exported = Source.replace(Marker, "\nmodule.exports = typeof WrapperSource !== \"undefined\" ? WrapperSource : Source;");
              const Test = new Module(Filename, module);
              Test.filename = Filename;
              Test.paths = Module._nodeModulePaths(path.dirname(Filename));
              Test._compile(Exported, Filename);
              return Test.exports;
          }
          let Source = fs.readFileSync(path.join(Root, "server-v11.js"), "utf8");
          Source = CompileWrapper(Source, path.join(Root, "server-v11.js"));
          Source = CompileWrapper(Source, path.join(Root, "server-v10.js"));
          Source = CompileWrapper(Source, path.join(Root, "server-v9.js"));
          const Temp = path.join(os.tmpdir(), "story-rewrite-generated-server.js");
          fs.writeFileSync(Temp, Source, "utf8");
          fs.writeFileSync(path.join(Root, "storybot-generated-debug.js"), Source, "utf8");
          const Check = spawnSync(process.execPath, ["--check", Temp], { encoding: "utf8" });
          try { fs.unlinkSync(Temp); } catch {}
          if (Check.status !== 0) {
              const Lines = Source.split("\n");
              const ErrorLine = /story-rewrite-generated-server\.js:(\d+)/.exec(Check.stderr || "");
              const LineNumber = Number(ErrorLine?.[1] || 0);
              if (LineNumber) {
                  process.stderr.write("\nGenerated source around line " + LineNumber + ":\n");
                  process.stderr.write(Lines.slice(Math.max(0, LineNumber - 90), LineNumber + 12).map((Line, Index) => String(Math.max(1, LineNumber - 89 + Index)) + " | " + Line).join("\n") + "\n");
                  process.stderr.write("\nTop-level closing patterns:\n");
                  Lines.forEach((Line, Index) => {
                      if (/^\s*\}\);\s*$/.test(Line) && !/^\s{4,}\S/.test(Line)) {
                          process.stderr.write(String(Index + 1) + " | " + Line + "\n");
                      }
                  });
                  process.stderr.write("\nClosure-removal syntax probes:\n");
                  for (let Index = 0; Index < Lines.length; Index += 1) {
                      if (!/^\s*\}\);\s*$/.test(Lines[Index]) || Index + 1 >= LineNumber) continue;
                      const TrialLines = Lines.slice();
                      TrialLines.splice(Index, 1);
                      const Trial = path.join(os.tmpdir(), "story-rewrite-trial-" + Index + ".js");
                      fs.writeFileSync(Trial, TrialLines.join("\n"), "utf8");
                      const TrialCheck = spawnSync(process.execPath, ["--check", Trial], { encoding: "utf8" });
                      try { fs.unlinkSync(Trial); } catch {}
                      if (TrialCheck.status === 0) {
                          process.stderr.write("Removing generated line " + (Index + 1) + " fixes syntax.\n");
                      }
                  }
                  for (const MarkerText of ['Io.on("connection"', 'Socket.on("storybot:ask"', 'Socket.on("disconnect"']) {
                      const MarkerIndex = Lines.findIndex(Line => Line.includes(MarkerText));
                      process.stderr.write("\nMarker " + MarkerText + " at line " + (MarkerIndex + 1) + "\n");
                      if (MarkerIndex >= 0) {
                          process.stderr.write(Lines.slice(Math.max(0, MarkerIndex - 12), MarkerIndex + 18).map((Line, Offset) => String(Math.max(1, MarkerIndex - 11 + Offset)) + " | " + Line).join("\n") + "\n");
                      }
                  }
              }
              process.stderr.write(Check.stderr || Check.stdout || "");
              process.exit(1);
          }
          for (const Needle of ['Socket.on("storybot:ask", async', "RunStoryBotModel(Context)", 'text: "@StoryBot " + Question']) {
              if (!Source.includes(Needle)) throw new Error("Generated server missing: " + Needle);
          }
          for (const Needle of ["private StoryBot prompt", "botPromptFor", "MaybeReplyAsStoryBot"]) {
              if (Source.includes(Needle)) throw new Error("Obsolete StoryBot path remains: " + Needle);
          }
          console.log("Generated StoryBot server patch chain OK.");
          NODE

      - name: Upload generated StoryBot server
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybot-generated-server-debug
          path: storybot-generated-debug.js
          if-no-files-found: ignore
          retention-days: 1
      - run: node --check dialog.js
      - run: node --check dialog-connection.js
      - run: node --check game-enhancements.js
      - run: node --check mobile-controls.js
      - run: node --check tutorial.js
