name: Validate Story Rewrite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - run: node --check server-v8.js
      - run: node --check server-v9.js
      - run: node --check server-v10.js
      - run: node --check network.js
      - run: node --check app.js
      - run: node --check audio.js
      - run: node --check auth.js
      - run: node --check main.js
      - run: node --check levels.js
      - run: node --check multiplayer.js
      - run: node --check multiplayer-connection.js
      - run: node --check moderation-version.js
      - run: node --check host-controls.js
      - run: node --check ai-chat.js
      - run: node --check dialog.js
      - run: node --check dialog-connection.js
      - run: node --check mobile-controls.js
      - run: node --check tutorial.js
