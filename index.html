<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Story Rewrite</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico?v=1000001">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png?v=1000001">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png?v=1000001">
<style>
html,
body,
#StoryShellRoot,
.StoryShellFrame {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

html {
    overflow: hidden;
    overscroll-behavior: none;
    background: #8a6749;
}

body {
    overflow: hidden;
    overscroll-behavior: none;
    background: transparent;
}

#StoryShellRoot {
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
}

.StoryShellFrame {
    position: absolute;
    inset: 0;
    display: block;
    visibility: hidden;
    border: 0;
    background: #8a6749;
}

#StoryShellPauseButton[hidden] {
    display: none !important;
}

#StoryShellPauseButton {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    z-index: 10000;
    width: 42px;
    height: 42px;
    padding: 0;
    display: grid;
    place-items: center;
    cursor: pointer;
    border: 1px solid rgba(226, 180, 108, .62);
    border-radius: 50%;
    color: #f2d39c;
    background: radial-gradient(circle at 32% 28%, #6f472b, #2a190f 74%);
    box-shadow:
        0 10px 28px rgba(0,0,0,.34),
        0 0 0 4px rgba(222, 170, 96, .08),
        inset 0 0 0 3px rgba(255, 238, 197, .045),
        inset 0 1px rgba(255,255,255,.11);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}

#StoryShellPauseButton:hover {
    transform: scale(1.06);
    border-color: #f0c67e;
    box-shadow:
        0 12px 30px rgba(0,0,0,.36),
        0 0 0 6px rgba(222, 170, 96, .11),
        0 0 26px rgba(222, 170, 96, .14),
        inset 0 1px rgba(255,255,255,.12);
}

#StoryShellPauseButton:active {
    transform: scale(.95);
}

#StoryShellPauseButton.IsPaused {
    border-color: #f2c97f;
    box-shadow:
        0 0 0 7px rgba(222, 170, 96, .13),
        0 0 30px rgba(222, 170, 96, .18),
        0 12px 30px rgba(0,0,0,.38),
        inset 0 0 0 3px rgba(255, 238, 197, .06);
}

#StoryShellPauseButton svg {
    width: 23px;
    height: 23px;
    fill: currentColor;
    pointer-events: none;
}

@media (max-width: 700px) {
    #StoryShellPauseButton {
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        width: 39px;
        height: 39px;
    }
}


/* Fluid shell control sizing; offsets follow viewport + safe-area instead of fixed device coordinates. */
#StoryShellPauseButton {
    inset-block-start: max(env(safe-area-inset-top), clamp(4px, .6vw, 9px));
    inset-inline-start: max(env(safe-area-inset-left), clamp(4px, .6vw, 9px));
    width: clamp(38px, 3.25vw, 46px);
    height: clamp(38px, 3.25vw, 46px);
    min-width: 38px;
    min-height: 38px;
}

#StoryShellPauseButton svg {
    width: clamp(19px, 1.65vw, 23px);
    height: clamp(19px, 1.65vw, 23px);
}

@media (pointer: coarse) {
    #StoryShellPauseButton {
        width: clamp(39px, 10vw, 46px);
        height: clamp(39px, 10vw, 46px);
    }

    #StoryShellPauseButton svg {
        width: clamp(20px, 5.2vw, 23px);
        height: clamp(20px, 5.2vw, 23px);
    }
}

/* Keep the game usable only in landscape on phone-sized viewports. */
#StoryLandscapeGuard {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    box-sizing: border-box;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 6vw, 44px);
    color: #f7e6c8;
    text-align: center;
    background:
        radial-gradient(circle at 50% 12%, rgba(213, 161, 90, .18), transparent 42%),
        linear-gradient(145deg, #20140e, #100b08 78%);
}
#StoryLandscapeGuard .StoryLandscapeCard {
    display: grid;
    justify-items: center;
    gap: 14px;
    width: 100%;
    max-width: 420px;
    box-sizing: border-box;
    padding: clamp(22px, 5vw, 38px);
    border: 1px solid rgba(219, 171, 103, .42);
    border-radius: 22px;
    background: linear-gradient(145deg, rgba(65, 42, 27, .96), rgba(31, 20, 14, .98));
    box-shadow: 0 24px 70px rgba(0, 0, 0, .42), inset 0 1px rgba(255, 239, 207, .07);
}
#StoryLandscapeGuard svg {
    width: clamp(52px, 13vw, 76px);
    height: clamp(52px, 13vw, 76px);
    fill: none;
    stroke: #f0c47a;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
}
#StoryLandscapeGuard h1 {
    margin: 0;
    color: #ffe5b7;
    font: 800 clamp(22px, 5.5vw, 30px)/1.15 Georgia, "Times New Roman", serif;
}
#StoryLandscapeGuard p {
    margin: 0;
    max-width: 32ch;
    color: #d0b695;
    font: 600 clamp(13px, 3.3vw, 16px)/1.55 system-ui, sans-serif;
}
@media screen and (max-width: 900px) and (orientation: portrait) {
    #StoryLandscapeGuard { display: flex; }
    #StoryShellRoot > iframe.StoryShellFrame {
        visibility: hidden !important;
        pointer-events: none !important;
    }
    #StoryShellPauseButton { display: none !important; }
}

#StoryStartupStatus {
    position: fixed;
    inset: 0;
    z-index: 2147483646;
    display: grid;
    place-items: center;
    padding: 24px;
    box-sizing: border-box;
    color: #f7e6c8;
    text-align: center;
    background: radial-gradient(circle at 50% 15%, rgba(213,161,90,.18), transparent 42%), linear-gradient(145deg,#20140e,#100b08 78%);
}
#StoryStartupStatus[hidden] { display: none !important; }
#StoryStartupStatus > div {
    width: min(100%, 440px);
    box-sizing: border-box;
    padding: 28px;
    border: 1px solid rgba(219,171,103,.42);
    border-radius: 20px;
    background: linear-gradient(145deg,rgba(65,42,27,.97),rgba(31,20,14,.99));
    box-shadow: 0 24px 70px rgba(0,0,0,.42);
}
#StoryStartupStatus h1 {
    margin: 0 0 10px;
    color: #ffe5b7;
    font: 800 24px/1.2 Georgia,"Times New Roman",serif;
}
#StoryStartupStatus p {
    margin: 0;
    color: #d0b695;
    font: 600 14px/1.55 system-ui,sans-serif;
}
#StoryStartupRetry {
    margin-top: 20px;
    padding: 11px 20px;
    border: 1px solid #d7a35d;
    border-radius: 10px;
    color: #28180d;
    background: linear-gradient(180deg,#f0cf91,#c98b48);
    font: 800 14px system-ui,sans-serif;
    cursor: pointer;
}
</style>
<script src="server-config.js?v=20261031-socket1"></script>
<script src="auth-bootstrap.js?v=20261030-cookie1"></script>
</head>
<body>
<div id="StoryShellRoot">
    <button id="StoryShellPauseButton" type="button" hidden aria-label="Pause game" title="Pause game" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="7" y="5.5" width="3.5" height="13" rx="1"></rect>
            <rect x="13.5" y="5.5" width="3.5" height="13" rx="1"></rect>
        </svg>
    </button>
    <iframe id="StoryShellFrame" class="StoryShellFrame" scrolling="auto" title="Story Rewrite"></iframe>
<div id="StoryStartupStatus" role="alert" aria-live="assertive">
    <div>
        <h1 id="StoryStartupTitle">Connecting to Story Rewrite…</h1>
        <p id="StoryStartupMessage">Checking your secure sign-in and loading the app.</p>
        <button id="StoryStartupRetry" type="button" hidden>Retry</button>
    </div>
</div>
<div id="StoryLandscapeGuard" role="alert" aria-live="assertive">
        <div class="StoryLandscapeCard">
            <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
                <rect x="17" y="22" width="30" height="20" rx="3"></rect>
                <path d="M10 20a24 24 0 0 1 40-6M50 14l0-8m0 8h-8M54 44a24 24 0 0 1-40 6M14 50v8m0-8h8"></path>
            </svg>
            <h1>Turn your device sideways</h1>
            <p>Story Rewrite is designed for landscape play. Rotate your screen horizontally to continue.</p>
        </div>
    </div>
</div>
<script>
(async () => {
    const Status = document.getElementById("StoryStartupStatus");
    const StatusTitle = document.getElementById("StoryStartupTitle");
    const StatusMessage = document.getElementById("StoryStartupMessage");
    const RetryButton = document.getElementById("StoryStartupRetry");

    function ShowStartupIssue(Title, Message) {
        StatusTitle.textContent = Title;
        StatusMessage.textContent = Message;
        RetryButton.hidden = false;
        Status.hidden = false;
    }

    RetryButton.addEventListener("click", () => window.location.reload());

    const LoadScript = Source => new Promise((Resolve, Reject) => {
        const Script = document.createElement("script");
        const Timeout = window.setTimeout(() => {
            Script.remove();
            Reject(new Error("A required Story Rewrite script timed out."));
        }, 20000);
        Script.src = Source;
        Script.onload = () => {
            window.clearTimeout(Timeout);
            Resolve();
        };
        Script.onerror = () => {
            window.clearTimeout(Timeout);
            Reject(new Error("A required Story Rewrite script could not load."));
        };
        document.body.appendChild(Script);
    });

    try {
        const Session = await (window.StoryCookieSessionReady
            || Promise.resolve({ authenticated: false, unavailable: true }));

        if (!Session?.authenticated) {
            if (Session?.unavailable) {
                ShowStartupIssue(
                    "Can't connect right now",
                    "Your sign-in was not cleared. The server did not respond in time. Check your connection and retry."
                );
                return;
            }
            window.location.replace("auth.html");
            return;
        }

        await LoadScript("cache-guard.js?v=20261030-cookie1");
        await LoadScript("shell.js?v=20261031-reload9");
        Status.hidden = true;
    } catch {
        ShowStartupIssue(
            "Story Rewrite couldn't finish loading",
            "A required app file did not respond. Your account session has been left alone. Retry the page when your connection is ready."
        );
    }
})();
</script>
</body>
</html>
