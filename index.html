<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Story Rewrite</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico?v=1000001">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png?v=1000001">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png?v=1000001">
<style>
html,
body,
#StoryShellRoot,
.StoryShellFrame {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

html,
body {
    overflow: hidden;
    background: #0b0d10;
}

#StoryShellRoot {
    position: fixed;
    inset: 0;
}

.StoryShellFrame {
    position: absolute;
    inset: 0;
    display: block;
    border: 0;
    background: #0b0d10;
}

.StoryAudioGate {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 1000;
    max-width: min(360px, calc(100vw - 36px));
    min-height: 66px;
    padding: 11px 15px 11px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #2d170d;
    border: 2px solid #c88d47;
    border-radius: 15px;
    background: linear-gradient(180deg, #ffe8bd, #e9bf7d);
    box-shadow: 0 12px 30px rgba(24, 10, 4, .38), inset 0 1px rgba(255, 255, 255, .62);
    font-family: Georgia, "Times New Roman", serif;
    text-align: left;
    cursor: pointer;
}

.StoryAudioGate[hidden] {
    display: none;
}

.StoryAudioGate:hover {
    color: #251108;
    border-color: #e2ac64;
    background: linear-gradient(180deg, #fff0cf, #f1cb8c);
}

.StoryAudioGate:focus-visible {
    outline: 4px solid #fff1ce;
    outline-offset: 3px;
}

.StoryAudioGate:disabled {
    cursor: wait;
    opacity: .82;
}

.StoryAudioGateIcon {
    width: 38px;
    height: 38px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    color: #fff0ce;
    border-radius: 11px;
    background: linear-gradient(145deg, #8d5930, #5d351f);
}

.StoryAudioGateIcon svg {
    width: 23px;
    height: 23px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.StoryAudioGateCopy {
    min-width: 0;
    display: grid;
    gap: 3px;
}

.StoryAudioGateCopy strong {
    font-size: 17px;
    line-height: 1;
}

.StoryAudioGateCopy small {
    color: #634129;
    font: 800 12px/1.25 system-ui, sans-serif;
}

@media (max-width: 620px) {
    .StoryAudioGate {
        right: 10px;
        bottom: 10px;
        max-width: calc(100vw - 20px);
    }
}
</style>
<script>
const AuthKey = "StoryRewriteAuthToken";
const LegacyKey = "StoryRewriteSessionToken";
let Token = localStorage.getItem(AuthKey) || "";

if (!Token) {
    Token = localStorage.getItem(LegacyKey) || sessionStorage.getItem(LegacyKey) || "";
    if (Token) {
        localStorage.setItem(AuthKey, Token);
        localStorage.removeItem(LegacyKey);
        sessionStorage.removeItem(LegacyKey);
    }
}

if (!Token) window.location.replace("auth.html");

</script>
</head>
<body>
<div id="StoryShellRoot">
    <iframe id="StoryShellFrame" class="StoryShellFrame" title="Story Rewrite"></iframe>
</div>
<button class="StoryAudioGate" id="StoryAudioGate" type="button" hidden>
    <span class="StoryAudioGateIcon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="presentation">
            <path d="M5 10v4h3l4 3V7L8 10Z"></path>
            <path d="M15.5 9.2a4 4 0 0 1 0 5.6"></path>
            <path d="M18 6.8a7.5 7.5 0 0 1 0 10.4"></path>
        </svg>
    </span>
    <span class="StoryAudioGateCopy">
        <strong>Enable sound</strong>
        <small id="StoryAudioGateStatus">One click enables music and sound effects.</small>
    </span>
</button>
<script src="cache-guard.js?v=20260821-60"></script>
<script>
const AssetFreshToken = Date.now().toString(36);
document.write(`<script src="audio.js?fresh=${AssetFreshToken}"><\/script>`);
document.write(`<script src="real-audio.js?fresh=${AssetFreshToken}"><\/script>`);
document.write(`<script src="shell.js?fresh=${AssetFreshToken}"><\/script>`);
</script>
</body>
</html>
