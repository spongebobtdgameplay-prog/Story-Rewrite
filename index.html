<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Story Rewrite</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico?v=1000001">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png?v=1000001">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png?v=1000001">
<style>
html,
body,
#StoryShellRoot,
#StoryShellFrame {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

html,
body {
    overflow: hidden;
    background: #0b0d10;
}

#StoryShellRoot {
    position: fixed;
    inset: 0;
}

#StoryShellFrame {
    display: block;
    border: 0;
    background: #0b0d10;
}
</style>
<script>
const AuthKey = "StoryRewriteAuthToken";
const LegacyKey = "StoryRewriteSessionToken";
let Token = localStorage.getItem(AuthKey) || "";

if (!Token) {
    Token = localStorage.getItem(LegacyKey) || sessionStorage.getItem(LegacyKey) || "";
    if (Token) {
        localStorage.setItem(AuthKey, Token);
        localStorage.removeItem(LegacyKey);
        sessionStorage.removeItem(LegacyKey);
    }
}

if (!Token) window.location.replace("auth.html");

window.StoryWorkerReplacementReady = (async () => {
    if (!("serviceWorker" in navigator)) return true;

    const CleanWorkerVersion = "20260820-48";
    const CleanWorkerUrl = new URL(`service-worker.js?clean=${CleanWorkerVersion}`, location.href).href;
    const Scope = new URL(".", location.href).pathname;

    const IsCleanController = () => {
        const ControllerUrl = navigator.serviceWorker.controller?.scriptURL || "";
        return ControllerUrl === CleanWorkerUrl;
    };

    try {
        const Registration = await navigator.serviceWorker.register(CleanWorkerUrl, {
            scope: Scope,
            updateViaCache: "none"
        });

        Registration.update().catch(() => {});

        if (IsCleanController()) return true;

        return await new Promise(Resolve => {
            let Finished = false;

            const Finish = Value => {
                if (Finished) return;
                Finished = true;
                navigator.serviceWorker.removeEventListener("controllerchange", OnControllerChange);
                Resolve(Value);
            };

            const OnControllerChange = () => {
                if (IsCleanController()) Finish(true);
            };

            navigator.serviceWorker.addEventListener("controllerchange", OnControllerChange);

            if (IsCleanController()) {
                Finish(true);
                return;
            }

            setTimeout(() => Finish(IsCleanController()), 3000);
        });
    } catch (Error) {
        console.warn("Could not replace legacy service worker:", Error);
        return false;
    }
})();
</script>
</head>
<body>
<div id="StoryShellRoot">
    <iframe id="StoryShellFrame" title="Story Rewrite" src="main.html"></iframe>
</div>
<script>
const AssetFreshToken = Date.now().toString(36);
document.write(`<script src="audio.js?fresh=${AssetFreshToken}"><\/script>`);
document.write(`<script src="real-audio.js?fresh=${AssetFreshToken}"><\/script>`);
document.write(`<script src="shell.js?fresh=${AssetFreshToken}"><\/script>`);
</script>
</body>
</html>
