<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Story Rewrite</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico?v=1000001">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png?v=1000001">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png?v=1000001">
<style>
html,
body,
#StoryShellRoot,
#StoryShellFrame {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

html,
body {
    overflow: hidden;
    background: #0b0d10;
}

#StoryShellRoot {
    position: fixed;
    inset: 0;
}

#StoryShellFrame {
    display: block;
    border: 0;
    background: #0b0d10;
}
</style>
<script>
const AuthKey = "StoryRewriteAuthToken";
const LegacyKey = "StoryRewriteSessionToken";
let Token = localStorage.getItem(AuthKey) || "";

if (!Token) {
    Token = localStorage.getItem(LegacyKey) || sessionStorage.getItem(LegacyKey) || "";
    if (Token) {
        localStorage.setItem(AuthKey, Token);
        localStorage.removeItem(LegacyKey);
        sessionStorage.removeItem(LegacyKey);
    }
}

if (!Token) window.location.replace("auth.html");

window.StoryAudioNetworkReady = (async () => {
    if (!("serviceWorker" in navigator)) return;

    const DeleteStoryCaches = async () => {
        if (!("caches" in window)) return;
        const CacheNames = await caches.keys().catch(() => []);
        await Promise.all(CacheNames
            .filter(CacheName => CacheName.startsWith("story-rewrite-"))
            .map(CacheName => caches.delete(CacheName).catch(() => false)));
    };

    await DeleteStoryCaches();

    const ExistingController = navigator.serviceWorker.controller;
    const ExistingRegistrations = await navigator.serviceWorker.getRegistrations().catch(() => []);

    if (!ExistingController) {
        await Promise.all(ExistingRegistrations.map(Registration => Registration.unregister().catch(() => false)));
        await DeleteStoryCaches();
        return;
    }

    try {
        const RepairUrl = new URL(`service-worker.js?repair=${Date.now().toString(36)}`, location.href).href;
        const Registration = await navigator.serviceWorker.register(RepairUrl, {
            scope: new URL(".", location.href).pathname,
            updateViaCache: "none"
        });

        if (navigator.serviceWorker.controller?.scriptURL !== RepairUrl) {
            await new Promise(Resolve => {
                const OnControllerChange = () => {
                    navigator.serviceWorker.removeEventListener("controllerchange", OnControllerChange);
                    Resolve();
                };

                navigator.serviceWorker.addEventListener("controllerchange", OnControllerChange);

                if (navigator.serviceWorker.controller?.scriptURL === RepairUrl) {
                    OnControllerChange();
                }
            });
        }

        await DeleteStoryCaches();
        setTimeout(() => {
            Registration.unregister().catch(() => false);
        }, 1000);
    } catch (Error) {
        console.warn("Legacy service worker repair failed:", Error);
    }
})();
</script>
</head>
<body>
<div id="StoryShellRoot">
    <iframe id="StoryShellFrame" title="Story Rewrite" src="about:blank"></iframe>
</div>
<script>
const AssetFreshToken = Date.now().toString(36);
for (const AssetName of ["audio.js", "real-audio.js", "shell.js"]) {
    document.write(`<script src="${AssetName}?fresh=${AssetFreshToken}"><\/script>`);
}
</script>
</body>
</html>
