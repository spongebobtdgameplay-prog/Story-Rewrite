<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Story Rewrite</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico?v=1000001">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png?v=1000001">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png?v=1000001">
<style>
html,
body,
#StoryShellRoot,
#StoryShellFrame {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

html,
body {
    overflow: hidden;
    background: #0b0d10;
}

#StoryShellRoot {
    position: fixed;
    inset: 0;
}

#StoryShellFrame {
    display: block;
    border: 0;
    background: #0b0d10;
}
</style>
<script>
const AuthKey = "StoryRewriteAuthToken";
const LegacyKey = "StoryRewriteSessionToken";
let Token = localStorage.getItem(AuthKey) || "";

if (!Token) {
    Token = localStorage.getItem(LegacyKey) || sessionStorage.getItem(LegacyKey) || "";
    if (Token) {
        localStorage.setItem(AuthKey, Token);
        localStorage.removeItem(LegacyKey);
        sessionStorage.removeItem(LegacyKey);
    }
}

if (!Token) window.location.replace("auth.html");

window.StoryWorkerReady = (async () => {
    if (!("serviceWorker" in navigator)) return;
    if (location.protocol !== "https:" && location.hostname !== "localhost") return;

    const WorkerUrl = new URL("service-worker.js?v=20260820-33", window.location.href).href;
    const Scope = new URL(".", window.location.href).pathname;

    try {
        const Registration = await navigator.serviceWorker.register(WorkerUrl, {
            scope: Scope,
            updateViaCache: "none"
        });

        await Registration.update().catch(() => {});

        const Candidate = Registration.installing || Registration.waiting;
        if (Candidate && Candidate.state !== "activated") {
            await new Promise(Resolve => {
                let Finished = false;
                const Finish = () => {
                    if (Finished) return;
                    if (Candidate.state !== "activated" && Candidate.state !== "redundant") return;
                    Finished = true;
                    Candidate.removeEventListener("statechange", Finish);
                    Resolve();
                };

                Candidate.addEventListener("statechange", Finish);
                Finish();
                setTimeout(() => {
                    if (Finished) return;
                    Finished = true;
                    Candidate.removeEventListener("statechange", Finish);
                    Resolve();
                }, 5000);
            });
        }

        if (!navigator.serviceWorker.controller || navigator.serviceWorker.controller.scriptURL !== WorkerUrl) {
            await new Promise(Resolve => {
                let Finished = false;
                const Finish = () => {
                    if (Finished) return;
                    Finished = true;
                    navigator.serviceWorker.removeEventListener("controllerchange", Finish);
                    Resolve();
                };

                navigator.serviceWorker.addEventListener("controllerchange", Finish);
                setTimeout(Finish, 5000);
            });
        }

        if ("caches" in window) {
            const Keys = await caches.keys().catch(() => []);
            await Promise.all(Keys
                .filter(Key => Key.startsWith("story-rewrite-"))
                .map(Key => caches.delete(Key).catch(() => false)));
        }
    } catch (Error) {
        console.warn("Service worker repair failed:", Error);
    }
})();
</script>
</head>
<body>
<div id="StoryShellRoot">
    <iframe id="StoryShellFrame" title="Story Rewrite" src="about:blank"></iframe>
</div>
<script src="audio.js?v=20260820-33"></script>
<script src="real-audio.js?v=20260820-33"></script>
<script src="shell.js?v=20260820-33"></script>
</body>
</html>
