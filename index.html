<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Story Rewrite</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico?v=1000001">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png?v=1000001">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png?v=1000001">
<style>
html,
body,
#StoryShellRoot,
#StoryShellFrame {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

html,
body {
    overflow: hidden;
    background: #0b0d10;
}

#StoryShellRoot {
    position: fixed;
    inset: 0;
}

#StoryShellFrame {
    display: block;
    border: 0;
    background: #0b0d10;
}
</style>
<script>
const AuthKey = "StoryRewriteAuthToken";
const LegacyKey = "StoryRewriteSessionToken";
let Token = localStorage.getItem(AuthKey) || "";

if (!Token) {
    Token = localStorage.getItem(LegacyKey) || sessionStorage.getItem(LegacyKey) || "";
    if (Token) {
        localStorage.setItem(AuthKey, Token);
        localStorage.removeItem(LegacyKey);
        sessionStorage.removeItem(LegacyKey);
    }
}

if (!Token) window.location.replace("auth.html");

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register(new URL("service-worker.js?v=9", window.location.href), {
            scope: new URL(".", window.location.href).pathname,
            updateViaCache: "none"
        }).then(Registration => {
            Registration.update().catch(() => {});
        }).catch(() => {});
    }, { once: true });
}
</script>
</head>
<body>
<div id="StoryShellRoot">
    <iframe id="StoryShellFrame" title="Story Rewrite" src="about:blank"></iframe>
</div>
<script src="audio.js?v=20260820-27"></script>
<script src="real-audio.js?v=20260820-28"></script>
<script src="shell.js?v=20260820-27"></script>
</body>
</html>
