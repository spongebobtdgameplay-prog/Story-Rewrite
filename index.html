<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Story Rewrite</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico?v=1000001">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png?v=1000001">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png?v=1000001">
<style>
html,
body,
#StoryShellRoot,
#StoryShellFrame {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

html,
body {
    overflow: hidden;
    background: #0b0d10;
}

#StoryShellRoot {
    position: fixed;
    inset: 0;
}

#StoryShellFrame {
    display: block;
    border: 0;
    background: #0b0d10;
}
</style>
<script>
const AuthKey = "StoryRewriteAuthToken";
const LegacyKey = "StoryRewriteSessionToken";
let Token = localStorage.getItem(AuthKey) || "";

if (!Token) {
    Token = localStorage.getItem(LegacyKey) || sessionStorage.getItem(LegacyKey) || "";
    if (Token) {
        localStorage.setItem(AuthKey, Token);
        localStorage.removeItem(LegacyKey);
        sessionStorage.removeItem(LegacyKey);
    }
}

if (!Token) window.location.replace("auth.html");

(async () => {
    if (!("serviceWorker" in navigator)) return;

    const Registrations = await navigator.serviceWorker.getRegistrations().catch(() => []);
    const HasLegacyWorker = Boolean(navigator.serviceWorker.controller || Registrations.length > 0);

    if ("caches" in window) {
        const CacheNames = await caches.keys().catch(() => []);
        await Promise.all(CacheNames
            .filter(CacheName => CacheName.startsWith("story-rewrite-"))
            .map(CacheName => caches.delete(CacheName).catch(() => false)));
    }

    if (!HasLegacyWorker) return;

    try {
        const KillUrl = new URL(`service-worker.js?kill=${Date.now().toString(36)}`, location.href).href;
        const Registration = await navigator.serviceWorker.register(KillUrl, {
            scope: new URL(".", location.href).pathname,
            updateViaCache: "none"
        });

        const FinishCleanup = async () => {
            await Registration.unregister().catch(() => false);
            if (!("caches" in window)) return;
            const CacheNames = await caches.keys().catch(() => []);
            await Promise.all(CacheNames
                .filter(CacheName => CacheName.startsWith("story-rewrite-"))
                .map(CacheName => caches.delete(CacheName).catch(() => false)));
        };

        if (navigator.serviceWorker.controller?.scriptURL === KillUrl) {
            await FinishCleanup();
            return;
        }

        navigator.serviceWorker.addEventListener("controllerchange", () => {
            FinishCleanup();
        }, { once: true });

        Registration.update().catch(() => {});
    } catch (Error) {
        console.warn("Legacy service worker cleanup failed:", Error);
    }
})();
</script>
</head>
<body>
<div id="StoryShellRoot">
    <iframe id="StoryShellFrame" title="Story Rewrite" src="about:blank"></iframe>
</div>
<script>
const AssetFreshToken = Date.now().toString(36);
for (const AssetName of ["audio.js", "real-audio.js", "shell.js"]) {
    document.write(`<script src="${AssetName}?fresh=${AssetFreshToken}"><\/script>`);
}
</script>
</body>
</html>
