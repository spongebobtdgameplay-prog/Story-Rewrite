<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Story Rewrite</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico?v=1000001">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png?v=1000001">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png?v=1000001">
<style>
html,
body,
#StoryShellRoot,
#StoryShellFrame {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

html,
body {
    overflow: hidden;
    background: #0b0d10;
}

#StoryShellRoot {
    position: fixed;
    inset: 0;
}

#StoryShellFrame {
    display: block;
    border: 0;
    background: #0b0d10;
}
</style>
<script>
const AuthKey = "StoryRewriteAuthToken";
const LegacyKey = "StoryRewriteSessionToken";
let Token = localStorage.getItem(AuthKey) || "";

if (!Token) {
    Token = localStorage.getItem(LegacyKey) || sessionStorage.getItem(LegacyKey) || "";
    if (Token) {
        localStorage.setItem(AuthKey, Token);
        localStorage.removeItem(LegacyKey);
        sessionStorage.removeItem(LegacyKey);
    }
}

if (!Token) window.location.replace("auth.html");

window.StoryStartupReady = (async () => {
    if (!("serviceWorker" in navigator)) return true;

    const Controller = navigator.serviceWorker.controller;
    const Registrations = await navigator.serviceWorker.getRegistrations().catch(() => []);

    await Promise.all(Registrations.map(Registration => Registration.unregister().catch(() => false)));

    if ("caches" in window) {
        const CacheNames = await caches.keys().catch(() => []);
        await Promise.all(CacheNames
            .filter(CacheName => CacheName.startsWith("story-rewrite-"))
            .map(CacheName => caches.delete(CacheName).catch(() => false)));
    }

    if (!Controller) return true;

    const CleanUrl = new URL(location.href);
    CleanUrl.searchParams.set("sw-reset", Date.now().toString(36));
    location.replace(CleanUrl.href);
    return false;
})();
</script>
</head>
<body>
<div id="StoryShellRoot">
    <iframe id="StoryShellFrame" title="Story Rewrite" src="about:blank"></iframe>
</div>
<script>
(async () => {
    if (!(await window.StoryStartupReady)) return;

    const CleanUrl = new URL(location.href);
    if (CleanUrl.searchParams.has("sw-reset")) {
        CleanUrl.searchParams.delete("sw-reset");
        history.replaceState(history.state, "", CleanUrl.href);
    }

    const AssetFreshToken = Date.now().toString(36);
    for (const AssetName of ["audio.js", "real-audio.js", "shell.js"]) {
        await new Promise((Resolve, Reject) => {
            const Script = document.createElement("script");
            Script.src = `${AssetName}?fresh=${AssetFreshToken}`;
            Script.onload = Resolve;
            Script.onerror = () => Reject(new Error(`Failed to load ${AssetName}`));
            document.body.appendChild(Script);
        });
    }
})().catch(Error => console.error("Story startup failed:", Error));
</script>
</body>
</html>
