<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Story Rewrite</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico?v=1000001">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png?v=1000001">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png?v=1000001">
<style>
html,
body,
#StoryShellRoot,
.StoryShellFrame {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

html,
body {
    overflow: hidden;
    overscroll-behavior: none;
    background:
        radial-gradient(circle at 15% 7%, rgba(255, 240, 207, .24), transparent 24%),
        radial-gradient(circle at 84% 16%, rgba(60, 30, 14, .19), transparent 28%),
        linear-gradient(155deg, #b38b61 0%, #8b6848 42%, #6e4c33 72%, #4d301f 100%);
    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: fixed;
}

#StoryShellRoot {
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
}

.StoryShellFrame {
    position: absolute;
    inset: 0;
    display: block;
    visibility: hidden;
    border: 0;
    background: transparent;
}

#StoryShellPauseButton[hidden] {
    display: none !important;
}

#StoryShellPauseButton {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    z-index: 10000;
    width: 42px;
    height: 42px;
    padding: 0;
    display: grid;
    place-items: center;
    cursor: pointer;
    border: 1px solid rgba(226, 180, 108, .62);
    border-radius: 50%;
    color: #f2d39c;
    background: radial-gradient(circle at 32% 28%, #6f472b, #2a190f 74%);
    box-shadow:
        0 10px 28px rgba(0,0,0,.34),
        0 0 0 4px rgba(222, 170, 96, .08),
        inset 0 0 0 3px rgba(255, 238, 197, .045),
        inset 0 1px rgba(255,255,255,.11);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}

#StoryShellPauseButton:hover {
    transform: scale(1.06);
    border-color: #f0c67e;
    box-shadow:
        0 12px 30px rgba(0,0,0,.36),
        0 0 0 6px rgba(222, 170, 96, .11),
        0 0 26px rgba(222, 170, 96, .14),
        inset 0 1px rgba(255,255,255,.12);
}

#StoryShellPauseButton:active {
    transform: scale(.95);
}

#StoryShellPauseButton.IsPaused {
    border-color: #f2c97f;
    box-shadow:
        0 0 0 7px rgba(222, 170, 96, .13),
        0 0 30px rgba(222, 170, 96, .18),
        0 12px 30px rgba(0,0,0,.38),
        inset 0 0 0 3px rgba(255, 238, 197, .06);
}

#StoryShellPauseButton svg {
    width: 23px;
    height: 23px;
    fill: currentColor;
    pointer-events: none;
}

@media (max-width: 700px) {
    #StoryShellPauseButton {
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        width: 39px;
        height: 39px;
    }
}


/* Fluid shell control sizing; offsets follow viewport + safe-area instead of fixed device coordinates. */
#StoryShellPauseButton {
    inset-block-start: max(env(safe-area-inset-top), clamp(10px, 2vw, 22px));
    inset-inline-start: max(env(safe-area-inset-left), clamp(10px, 2vw, 22px));
    width: clamp(38px, 3.25vw, 46px);
    height: clamp(38px, 3.25vw, 46px);
    min-width: 38px;
    min-height: 38px;
}

#StoryShellPauseButton svg {
    width: clamp(19px, 1.65vw, 23px);
    height: clamp(19px, 1.65vw, 23px);
}

@media (pointer: coarse) {
    #StoryShellPauseButton {
        width: clamp(39px, 10vw, 46px);
        height: clamp(39px, 10vw, 46px);
    }

    #StoryShellPauseButton svg {
        width: clamp(20px, 5.2vw, 23px);
        height: clamp(20px, 5.2vw, 23px);
    }
}
</style>
<script>
const AuthKey = "StoryRewriteAuthToken";
const LegacyKey = "StoryRewriteSessionToken";
let Token = localStorage.getItem(AuthKey) || "";

if (!Token) {
    Token = localStorage.getItem(LegacyKey) || sessionStorage.getItem(LegacyKey) || "";
    if (Token) {
        localStorage.setItem(AuthKey, Token);
        localStorage.removeItem(LegacyKey);
        sessionStorage.removeItem(LegacyKey);
    }
}

if (!Token) window.location.replace("auth.html");

</script>
</head>
<body>
<div id="StoryShellRoot">
    <button id="StoryShellPauseButton" type="button" hidden aria-label="Pause game" title="Pause game" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="7" y="5.5" width="3.5" height="13" rx="1"></rect>
            <rect x="13.5" y="5.5" width="3.5" height="13" rx="1"></rect>
        </svg>
    </button>
    <iframe id="StoryShellFrame" class="StoryShellFrame" scrolling="auto" title="Story Rewrite"></iframe>
</div>
<script src="cache-guard.js?v=20261001-1"></script>
<script src="shell.js?v=20261008-2"></script>
</body>
</html>
