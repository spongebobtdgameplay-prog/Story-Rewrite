<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="cache-guard.js?v=20260821-60"></script>
<title>Story Rewrite — Account</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico?v=1000001">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png?v=1000001">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png?v=1000001">
<link rel="stylesheet" href="looks.css?v=20260822-66">
<link rel="stylesheet" href="multiplayer.css">
<link rel="stylesheet" href="shell-ui.css">
</head>
<body class="AccountPage">
<main class="AccountShell">
    <section class="AccountCard">
        <div class="AccountBrand">Story Rewrite</div>
        <h1 id="AccountTitle">Create your account</h1>
        <p class="AccountLead">Create an account or sign in to continue your story.</p>

        <div class="AccountTabs">
            <button class="AccountTab Active" id="RegisterTab" type="button">Create Account</button>
            <button class="AccountTab" id="LoginTab" type="button">Sign In</button>
        </div>

        <form id="AccountForm" class="AccountForm">
            <label>Username<input id="UsernameInput" autocomplete="username" maxlength="20" required></label>
            <label>
                Password
                <span class="PasswordInputWrap">
                    <input id="PasswordInput" type="password" autocomplete="new-password" maxlength="128" required>
                    <button class="PasswordToggle" type="button" data-password-toggle="PasswordInput" aria-label="Show password"></button>
                </span>
            </label>
            <label id="ConfirmLabel">
                Confirm Password
                <span class="PasswordInputWrap">
                    <input id="ConfirmInput" type="password" autocomplete="new-password" maxlength="128">
                    <button class="PasswordToggle" type="button" data-password-toggle="ConfirmInput" aria-label="Show password"></button>
                </span>
            </label>
            <button class="PrimaryButton AccountSubmit" id="AccountSubmit" type="submit">Create Account</button>
        </form>

        <div class="ServerSetup Hidden" id="ServerSetup">
            <label>Server URL<input id="ServerUrlInput" placeholder="https://your-story-rewrite-server.example.com"></label>
            <button class="SecondaryButton" id="SaveServerButton" type="button">Use This Server</button>
        </div>

        <div class="StatusText Hidden" id="AccountStatus"></div>
    </section>
</main>
<script src="server-config.js"></script>
<script src="network.js?v=20260821-60"></script>
<script src="app.js"></script>
<script src="shell-ui.js"></script>
<script src="auth.js"></script>
</body>
</html>
