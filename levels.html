<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Rewrite | Level Select</title>
    <link rel="stylesheet" href="looks.css">
    <script defer src="app.js"></script>
    <script defer src="levels.js"></script>
</head>
<body class="paper-body">
    <div class="paper-shell">
        <header class="select-hero">
            <a class="top-button" href="main.html">Back</a>

            <div class="select-hero-copy">
                <div class="eyebrow">Story Rewrite</div>
                <h1>Choose a Chapter</h1>
                <p>Pick a world, choose an unlocked level, and rewrite the story.</p>
            </div>

            <div class="hero-stat-strip" id="OverviewStats"></div>
        </header>

        <section class="world-rail-wrap">
            <div class="world-rail-title">
                <h2>Worlds</h2>
                <p>Finish chapters to unlock what comes next.</p>
            </div>
            <div class="world-rail" id="WorldRail"></div>
        </section>

        <section id="SelectedWorld"></section>

        <div class="page-error" id="PageError" hidden></div>
    </div>
</body>
</html>
