<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="cache-guard.js?v=20260821-62"></script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Story Rewrite | Chapter Map</title>
    <link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico?v=1000001">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png?v=1000001">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png?v=1000001">
    <script>
    const LevelsFreshToken = Date.now().toString(36);
    for (const StyleName of ["looks.css", "game-ui.css", "multiplayer.css", "shell-ui.css"]) {
        document.write(`<link rel="stylesheet" href="${StyleName}?fresh=${LevelsFreshToken}">`);
    }
    </script>
    <style>
        .StageNodeDifficulty {
            min-height: 18px;
            padding: 3px 6px;
            color: #c49a61;
            border: 1px solid rgba(196, 154, 97, .2);
            border-radius: 5px;
            background: rgba(0, 0, 0, .2);
            font: 900 7px/1.2 system-ui, sans-serif;
            letter-spacing: .09em;
            text-transform: uppercase;
        }
        .StageNodeWrap.Selected .StageNodeDifficulty {
            color: #ffe0a8;
            border-color: rgba(240, 190, 112, .45);
        }
    </style>
</head>
<body class="LevelSelectPage">
    <div class="LevelSelectShell">
        <header class="GameSelectHeader">
            <button class="GameBackButton IconBackButton" type="button" data-story-back="main.html" aria-label="Go back"></button>
            <div class="GameHeaderCopy">
                <div class="GameHeaderEyebrow">Story Rewrite</div>
                <h1>Chapter Map</h1>
                <p>Choose a world, follow its route, and open the next page.</p>
            </div>
            <div class="GameHeaderActions">
                <button class="GameHeaderButton" type="button" data-story-go="multiplayer.html">Multiplayer</button>
                <button class="GameHeaderButton" type="button" data-story-go="tutorial.html">How to Play</button>
            </div>
        </header>
        <section class="GameStatsBar" id="OverviewStats"></section>
        <section class="WorldStripPanel"><div class="WorldStrip" id="WorldRail"></div></section>
        <main id="SelectedWorld"></main>
        <div class="page-error" id="PageError" hidden></div>
    </div>
<script>
for (const ScriptName of [
    "server-config.js",
    "network.js",
    "app.js",
    "audio.js",
    "real-audio.js",
    "shell-ui.js",
    "levels.js"
]) {
    document.write(`<script src="${ScriptName}?fresh=${LevelsFreshToken}"><\/script>`);
}
</script>
</body>
</html>
